name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: 1.99.0
  CARGO_BUILD_JOBS: 4

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt

      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.99.0-${{ hashFiles('Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check dashboard JavaScript
        run: node --check dashboard/app.js

      - name: Build workspace and examples
        run: cargo build --locked --workspace --all-targets

      - name: Test workspace
        run: |
          test_log="$RUNNER_TEMP/roboclaw-tests.log"
          if cargo test --locked --workspace --all-targets > "$test_log" 2>&1; then
            cat "$test_log"
          else
            cat "$test_log"
            python3 - "$test_log" <<'PY'
          import pathlib, sys
          output = pathlib.Path(sys.argv[1]).read_text()
          failure = output.split('\nfailures:\n', 1)[-1][:9000]
          escaped = failure.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Workspace test failure::' + escaped)
          PY
            exit 1
          fi

      - name: Check mock demo
        run: bash scripts/check_mock_demo.sh
